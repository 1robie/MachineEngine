# Menu of example:crate (picked automatically from the file name <namespace>_<value>.yml).
# Each machineengine_slot shows one slot of the crate's "items" storage; click with an item to put
# it in, click with an empty hand to take the stack out.
size: 27
name: "&8Crate"
update-interval: 500

items:
  background:
    is-permanent: true
    item:
      material: BLACK_STAINED_GLASS_PANE
      name: "&8"
    slots:
      - 0-26
  slot-1: { type: machineengine_slot, slot: 9, storage: items, storage-slot: 1, update: true, item: { material: LIGHT_GRAY_STAINED_GLASS_PANE, name: "&7Empty slot" } }
  slot-2: { type: machineengine_slot, slot: 10, storage: items, storage-slot: 2, update: true, item: { material: LIGHT_GRAY_STAINED_GLASS_PANE, name: "&7Empty slot" } }
  slot-3: { type: machineengine_slot, slot: 11, storage: items, storage-slot: 3, update: true, item: { material: LIGHT_GRAY_STAINED_GLASS_PANE, name: "&7Empty slot" } }
  slot-4: { type: machineengine_slot, slot: 12, storage: items, storage-slot: 4, update: true, item: { material: LIGHT_GRAY_STAINED_GLASS_PANE, name: "&7Empty slot" } }
  slot-5: { type: machineengine_slot, slot: 13, storage: items, storage-slot: 5, update: true, item: { material: LIGHT_GRAY_STAINED_GLASS_PANE, name: "&7Empty slot" } }
  slot-6: { type: machineengine_slot, slot: 14, storage: items, storage-slot: 6, update: true, item: { material: LIGHT_GRAY_STAINED_GLASS_PANE, name: "&7Empty slot" } }
  slot-7: { type: machineengine_slot, slot: 15, storage: items, storage-slot: 7, update: true, item: { material: LIGHT_GRAY_STAINED_GLASS_PANE, name: "&7Empty slot" } }
  slot-8: { type: machineengine_slot, slot: 16, storage: items, storage-slot: 8, update: true, item: { material: LIGHT_GRAY_STAINED_GLASS_PANE, name: "&7Empty slot" } }
  slot-9: { type: machineengine_slot, slot: 17, storage: items, storage-slot: 9, update: true, item: { material: LIGHT_GRAY_STAINED_GLASS_PANE, name: "&7Empty slot" } }
  contents:
    slot: 4
    update: true
    item:
      material: CHEST
      name: "&eCrate"
      lore:
        - "&7Items: &f%zmenu_machineengine_storage_items_amount%&7/&f%zmenu_machineengine_storage_items_capacity%"
        - "&a%zmenu_machineengine_storage_items_bar%"
