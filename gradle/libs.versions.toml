[versions]
# D25: compile against the newest Paper API (26.x versions look like this, no -R0.1-SNAPSHOT)...
paper = "26.3.build.156-beta"
# ...but use only what the oldest supported version has: verifyPaperBaseline checks the bytecode
# against this API (and the Adventure, Guava... versions it brings).
paper-baseline = "1.20.6-R0.1-SNAPSHOT"
asm = "9.8"
# nms:v* modules (D24): Paper dev bundles with the server classes, Mojang-mapped.
paperweight = "2.0.0-beta.24"
jetbrains-annotations = "26.0.2"
junit = "6.1.3"
shadow = "9.6.1"
plugin-yml = "0.9.0"
run-paper = "3.1.0"
zmenu = "1.1.1.9"
# Shaded and relocated (D35).
# main at 2fafd75 (removal namespace without PluginMeta#namespace, for 1.20.6): JitPack's main-SNAPSHOT
# still serves an older build. Switch to the release tag once there is one.
paper-dispatch = "2fafd75"
folialib = "0.5.1"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
paper-api-baseline = { module = "io.papermc.paper:paper-api", version.ref = "paper-baseline" }
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrains-annotations" }
zmenu-api = { module = "fr.maxlego08.menu:zmenu-api", version.ref = "zmenu" }
paper-dispatch = { module = "com.github.1robie.paper-dispatch:paper-dispatch", version.ref = "paper-dispatch" }
folialib = { module = "com.tcoded:FoliaLib", version.ref = "folialib" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
plugin-yml-paper = { id = "de.eldoria.plugin-yml.paper", version.ref = "plugin-yml" }
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-paper" }
paperweight-userdev = { id = "io.papermc.paperweight.userdev", version.ref = "paperweight" }
