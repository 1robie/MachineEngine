[versions]
# D19: compile against the lowest supported Paper API (1.20.6); run on 1.20.6 and 26.3.
paper = "1.20.6-R0.1-SNAPSHOT"
# Paper 1.20.6 bundles Adventure 4.17.0; the API must not require anything newer.
adventure = "4.17.0"
jetbrains-annotations = "26.0.2"
junit = "6.1.3"
shadow = "9.6.1"
plugin-yml = "0.9.0"
run-paper = "3.1.0"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
adventure-key = { module = "net.kyori:adventure-key", version.ref = "adventure" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrains-annotations" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
plugin-yml-paper = { id = "de.eldoria.plugin-yml.paper", version.ref = "plugin-yml" }
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-paper" }
