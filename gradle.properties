group=fr.robie
version=0.1.0-SNAPSHOT

# CraftEngine (D7): build against the latest dev snapshot. CI also runs against the newest
# published snapshot via -Pcraftengine_version=<version>.
craftengine_version=26.10-SNAPSHOT
# Git ref built by :plugin:buildCraftEngineDev for dev servers.
craftengine_dev_ref=dev
# Runtime CraftEngine for dev servers: "dev" (jar built from craftengine_dev_ref),
# "modrinth" (published release craftengine_modrinth_version) or "none" (no CraftEngine).
craftengine_runtime=dev
craftengine_modrinth_version=26.9.2

# Mekanized imports Mekanism (MIT) from this exact commit (MEKANIZED_PLAN.md, K4): branch 26.1.
mekanism_repository=https://github.com/mekanism/Mekanism.git
mekanism_commit=4718860a0c98598cf1b34e9f631b24eaa7c7ff47

org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
