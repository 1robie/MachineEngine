# MachineEngine's player-facing text, translated on each player's client in their own language.
# Edit freely (MiniMessage colors work); %s are the arguments, in order (%1$s, %2$s to reorder).
# Add a section per Minecraft language code (de_de, es_es …). Players without the resource pack
# see the English text built into MachineEngine. This file is never overwritten; delete it to get
# the defaults (and new keys) back.
lang:
  en_us:
    machineengine.contents.kept: "<gray>Contents kept"
    machineengine.contents.entry: "  <white>%s</white> <gray>%s"
    machineengine.contents.more: "<dark_gray>… and %s more"
    machineengine.machine.missing_addon: "<red>This machine belongs to an addon that is not installed (%s)."
    machineengine.machine.placeholder_break_denied: "<red>This machine (%s) belongs to an addon that is not installed. Breaking it would destroy its data."
    machineengine.machine.chunk_limit: "<red>This chunk already holds %s machines (limit %s)."
    machineengine.debug.on: "<gold>Debug view on: dots show machine states (green active, blue sleeping, orange blocked, red error), ports (blue in, orange out, purple both) and networks; look at a machine for details."
    machineengine.debug.off: "<gray>Debug view off."
    machineengine.item.filled: "<green>Filled %s of %s"
    machineengine.reader.not_machine: "<gray>Not a machine"
    machineengine.reader.machine: "<gold>%s:"
    machineengine.reader.storage: "<gray>  %s: %s / %s (%s)"
    machineengine.wrench.busy: "<red>The machine is busy; try again"
    machineengine.lore.energy: "<gray>Energy: %s / %s %s"
    machineengine.lore.resource: "<gray>%s: %s / %s %s"
  fr_fr:
    machineengine.contents.kept: "<gray>Contenu conservé"
    machineengine.contents.entry: "  <white>%s</white> <gray>%s"
    machineengine.contents.more: "<dark_gray>… et %s de plus"
    machineengine.machine.missing_addon: "<red>Cette machine appartient à un addon qui n'est pas installé (%s)."
    machineengine.machine.placeholder_break_denied: "<red>Cette machine (%s) appartient à un addon qui n'est pas installé. La casser détruirait ses données."
    machineengine.machine.chunk_limit: "<red>Ce chunk contient déjà %s machines (limite %s)."
    machineengine.debug.on: "<gold>Vue de débogage activée : les points montrent l'état des machines (vert actif, bleu en veille, orange bloqué, rouge erreur), les ports (bleu entrée, orange sortie, violet les deux) et les réseaux ; regardez une machine pour les détails."
    machineengine.debug.off: "<gray>Vue de débogage désactivée."
    machineengine.item.filled: "<green>%s de %s ajoutés"
    machineengine.reader.not_machine: "<gray>Ce n'est pas une machine"
    machineengine.reader.machine: "<gold>%s :"
    machineengine.reader.storage: "<gray>  %s : %s / %s (%s)"
    machineengine.wrench.busy: "<red>La machine est occupée ; réessayez"
    machineengine.lore.energy: "<gray>Énergie : %s / %s %s"
    machineengine.lore.resource: "<gray>%s : %s / %s %s"
