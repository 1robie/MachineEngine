# Templates for blocks that use MachineEngine's CraftEngine types. Rewritten at every start: do not edit
# (copy a template into your own pack under another name to change it).
templates:
  # A machine block with `keep_contents: true` drops itself, with the machine's state inside
  # (the machineengine:keep_contents loot function). Use: loot: { template: machineengine:loot_table/keep_contents }
  machineengine:loot_table/keep_contents:
    pools:
      - rolls: 1
        conditions:
          - type: survives_explosion
        entries:
          - type: item
            item: ${__NAMESPACE__}:${__ID__}
        functions:
          - type: machineengine:keep_contents

  # A block that is a MachineEngine machine of the same id, kept with its contents when broken.
  # Use it at the top of the block; keys written next to it are merged in, so a block adds its own
  # behavior options (D34), settings and states:
  #   mekanized:digital_miner:
  #     template: machineengine:block/machine
  #     behavior:
  #       options: { energy-per-block: 2000 }
  # A block whose machine type has another id adds `behavior: { machine: <id> }`.
  machineengine:block/machine:
    behavior:
      type: machineengine:machine
      machine: ${__NAMESPACE__}:${__ID__}
      keep_contents: true
    loot:
      template: machineengine:loot_table/keep_contents

  # A block that is a MachineEngine transport of the same id (a cable, pipe, …), dropping itself.
  # Use it at the top of the block, and add the rest next to it (D34: the rate is the block's):
  #   mekanized:basic_universal_cable:
  #     template: machineengine:block/transport
  #     behavior:
  #       rate: 8000
  #       connection_items: mekanized:cable_part/basic_universal_cable
  machineengine:block/transport:
    behavior:
      type: machineengine:transport
      transport: ${__NAMESPACE__}:${__ID__}
    loot:
      template: default:loot_table/self

  # A solid block turned by `facing` (4 directions) that shows another model while `active`
  # (machines set it while they work). Arguments, both optional:
  #   model: the idle model (default <namespace>:block/<id>)
  #   active_model: the working model (default <namespace>:block/<id>_active)
  # Use: states: { template: machineengine:block_state/facing_active, arguments: { model: ... } }
  machineengine:block_state/facing_active:
    properties:
      facing:
        type: 4-direction
        default: north
      active:
        type: boolean
        default: false
    appearances:
      facing_north_active_false:
        auto_state: solid
        model:
          path: ${model:-"${__NAMESPACE__}:block/${__ID__}"}
      facing_south_active_false:
        auto_state: solid
        model:
          path: ${model:-"${__NAMESPACE__}:block/${__ID__}"}
          y: 180
      facing_east_active_false:
        auto_state: solid
        model:
          path: ${model:-"${__NAMESPACE__}:block/${__ID__}"}
          y: 90
      facing_west_active_false:
        auto_state: solid
        model:
          path: ${model:-"${__NAMESPACE__}:block/${__ID__}"}
          y: 270
      facing_north_active_true:
        auto_state: solid
        model:
          path: ${active_model:-"${__NAMESPACE__}:block/${__ID__}_active"}
      facing_south_active_true:
        auto_state: solid
        model:
          path: ${active_model:-"${__NAMESPACE__}:block/${__ID__}_active"}
          y: 180
      facing_east_active_true:
        auto_state: solid
        model:
          path: ${active_model:-"${__NAMESPACE__}:block/${__ID__}_active"}
          y: 90
      facing_west_active_true:
        auto_state: solid
        model:
          path: ${active_model:-"${__NAMESPACE__}:block/${__ID__}_active"}
          y: 270
    variants:
      facing=north,active=false:
        appearance: facing_north_active_false
      facing=south,active=false:
        appearance: facing_south_active_false
      facing=east,active=false:
        appearance: facing_east_active_false
      facing=west,active=false:
        appearance: facing_west_active_false
      facing=north,active=true:
        appearance: facing_north_active_true
      facing=south,active=true:
        appearance: facing_south_active_true
      facing=east,active=true:
        appearance: facing_east_active_true
      facing=west,active=true:
        appearance: facing_west_active_true

  # A block turned by `facing` (4 directions) that display entities draw (MachineEngine's
  # display_item): the block itself shows one invisible model whatever its facing, so blocks with
  # the same breaking particles can share one vanilla visual state. Arguments:
  #   display_state: the id of the shared visual state (blocks with the same id share it; their
  #     display_model must then be the same)
  #   display_model: the invisible model, which gives the breaking particles
  #   state_type: the auto_state group (default leaves)
  machineengine:block_state/display_rendered_facing:
    properties:
      facing:
        type: 4-direction
        default: north
    appearances:
      default:
        auto_state:
          type: ${state_type:-leaves}
          id: ${display_state}
        model:
          path: ${display_model}
    variants:
      facing=north:
        appearance: default
      facing=south:
        appearance: default
      facing=east:
        appearance: default
      facing=west:
        appearance: default

  # A solid block with one model (argument model, default <namespace>:block/<id>).
  # Use under `state:` (a block with no properties): state: { template: machineengine:block_state/solid }
  machineengine:block_state/solid:
    auto_state: solid
    model:
      path: ${model:-"${__NAMESPACE__}:block/${__ID__}"}

  # A solid block turned by `facing` (4 directions). Argument model (default <namespace>:block/<id>).
  machineengine:block_state/facing:
    properties:
      facing:
        type: 4-direction
        default: north
    appearances:
      facing_north:
        auto_state: solid
        model:
          path: ${model:-"${__NAMESPACE__}:block/${__ID__}"}
      facing_south:
        auto_state: solid
        model:
          path: ${model:-"${__NAMESPACE__}:block/${__ID__}"}
          y: 180
      facing_east:
        auto_state: solid
        model:
          path: ${model:-"${__NAMESPACE__}:block/${__ID__}"}
          y: 90
      facing_west:
        auto_state: solid
        model:
          path: ${model:-"${__NAMESPACE__}:block/${__ID__}"}
          y: 270
    variants:
      facing=north:
        appearance: facing_north
      facing=south:
        appearance: facing_south
      facing=east:
        appearance: facing_east
      facing=west:
        appearance: facing_west

  # A solid block that shows another model while `active`. Arguments model and active_model
  # (defaults <namespace>:block/<id> and <namespace>:block/<id>_active).
  machineengine:block_state/active:
    properties:
      active:
        type: boolean
        default: false
    appearances:
      active_false:
        auto_state: solid
        model:
          path: ${model:-"${__NAMESPACE__}:block/${__ID__}"}
      active_true:
        auto_state: solid
        model:
          path: ${active_model:-"${__NAMESPACE__}:block/${__ID__}_active"}
    variants:
      active=false:
        appearance: active_false
      active=true:
        appearance: active_true

  # A block without properties that display entities draw: one invisible model. Use under
  # `state:`. Arguments as machineengine:block_state/display_rendered_facing.
  machineengine:block_state/display_rendered:
    auto_state:
      type: ${state_type:-leaves}
      id: ${display_state}
    model:
      path: ${display_model}

  # As machineengine:block_state/display_rendered_facing, turned by `facing` in all 6 directions.
  machineengine:block_state/display_rendered_facing_6:
    properties:
      facing:
        type: 6-direction
        default: north
    appearances:
      default:
        auto_state:
          type: ${state_type:-leaves}
          id: ${display_state}
        model:
          path: ${display_model}
    variants:
      facing=north:
        appearance: default
      facing=south:
        appearance: default
      facing=east:
        appearance: default
      facing=west:
        appearance: default
      facing=up:
        appearance: default
      facing=down:
        appearance: default
