# MachineEngine data-driven definitions: resources, recipes and whole machines without Java.
# Every *.yml file in this folder is read at startup. Recipes reload with /machineengine reload recipes;
# resources and machines need a restart. Invalid entries are skipped and listed in
# /machineengine report with their file and path.
#
# To use this example, set enabled to true, restart, then add a CraftEngine block with
#   behavior: { type: machineengine:machine, machine: custom:iron_press }
# Its menu is menus/machine.yml unless you add menus/custom_iron_press.yml.
enabled: false

# MachineEngine provides machineengine:energy and the fluids machineengine:fluid/water and
# machineengine:fluid/lava (units in config.yml). Declare your own resources here: a new fluid joins
# the global fluid category, so every fluid pipe and port takes it.
resource-types:
  custom:fluid/oil: { category: machineengine:fluid }
# A resource of a new kind (mana, heat …) needs its own category:
# resource-categories:
#   custom:mana: { unit: MP, scale: 0 }
# resource-types:
#   custom:mana: { category: custom:mana }

# Recipe types machines run.
recipe-types:
  - custom:pressing

machines:
  custom:iron_press:
    storages:
      input:  { slots: 1, capacity: 64, filter: { item: minecraft:raw_iron } }
      output: { slots: 1, capacity: 64 }
      energy: { capacity: 10000, filter: { type: machineengine:energy } }
    # Ports: what neighbors, cables and networks may do on each side (relative to the facing).
    ports:
      in:     { storage: input,  direction: input,  sides: [top, back] }
      out:    { storage: output, direction: output, sides: [bottom] }
      power:  { storage: energy, direction: input,  sides: [left, right] }
    upgrade-slots: 2
    # Ticks caught up after the chunk was unloaded (0 = frozen while unloaded).
    catch-up: 0
    # Behavior types: machineengine:processing, machineengine:storage, or any an addon registers.
    behavior:
      type: machineengine:processing
      recipes: custom:pressing
      inputs: [input]
      output: output
      costs: energy
      # push: front            # also push the output into the neighbor in front

recipes:
  custom:press_iron:
    type: custom:pressing
    duration: 100
    # Inputs are filters with an amount: {item: id}, {type: key}, {tag: key}, {category: key},
    # {all: [...]}, {any-of: [...]}, {not: {...}}.
    inputs:
      - { item: minecraft:raw_iron, amount: 1 }
    outputs:
      - { item: minecraft:iron_ingot, amount: 1 }
    cost-per-tick:
      - { type: machineengine:energy, amount: 20 }
