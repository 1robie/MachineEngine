name: Build

on:
  push:
  pull_request:
  schedule:
    # Daily run against the newest CraftEngine snapshot to catch upstream API churn early (§2).
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (CraftEngine ${{ matrix.craftengine }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        craftengine: [pinned, latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve newest CraftEngine snapshot
        if: matrix.craftengine == 'latest'
        run: |
          version=$(curl -fsSL https://repo.momirealms.net/snapshots/net/momirealms/craft-engine-core/maven-metadata.xml \
            | grep -oP '(?<=<version>)[^<]+(?=</version>)' | sort -V | tail -n 1)
          echo "Newest CraftEngine snapshot: $version"
          echo "CE_ARGS=-Pcraftengine_version=$version" >> "$GITHUB_ENV"

      - name: Build and test
        run: ./gradlew build ${CE_ARGS:-} --console=plain

      # API compatibility (§5): enable once the first API version is released.
      # - name: Check API binary compatibility
      #   run: ./gradlew :api:japicmp

      - name: Upload plugin jar
        if: matrix.craftengine == 'pinned'
        uses: actions/upload-artifact@v4
        with:
          name: MachineEngine
          path: plugin/build/libs/MachineEngine-*.jar
