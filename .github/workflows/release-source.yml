name: Release source

# main only takes releases (docs/BRANCHING_PLAN.md): a pull request into it must come from develop or
# a hotfix/* branch of this repository. The main ruleset requires this check; a ruleset cannot
# restrict the source branch on its own.
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]

permissions: {}

jobs:
  release-source:
    name: Release source
    runs-on: ubuntu-latest
    steps:
      - name: Check the source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::A pull request into main must come from this repository, not $HEAD_REPO."
            exit 1
          fi
          case "$HEAD_REF" in
            develop|hotfix/*) echo "Source branch $HEAD_REF is allowed." ;;
            *) echo "::error::A pull request into main must come from develop or hotfix/*, not $HEAD_REF. Target develop instead."
               exit 1 ;;
          esac
