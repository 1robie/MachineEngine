# MachineEngine configuration.
# Missing settings are added with their defaults when the server starts and on /machineengine reload config.

limits:
  # Most machines a single chunk may hold (players with machineengine.admin are exempt). 0 = no limit.
  max-machines-per-chunk: 256

menus:
  # Machine menus use zMenu (https://modrinth.com/plugin/zmenu). Menu files live in menus/.
  # A machine opens menus.by-type, else the file <namespace>_<value>.yml, else this default.
  default: machine
  # Menu file per machine type, e.g.
  #   example:generator: machine
  by-type: {}

events:
  # Mirror machine events (create, load, unload, remove, process start/complete) as Bukkit events
  # (fr.robie.machineengine.paper.event) for plugins that do not use the MachineEngine API.
  # Events nobody listens to cost nothing. Restart to apply.
  bukkit-bridge: true

placeholders:
  # Whether players without machineengine.admin.breakplaceholders may break placeholder machines
  # (machines whose addon is not installed). Breaking one destroys its data.
  allow-breaking: false

players:
  # Where the data addons keep per player (radiation dose, settings, ...) is saved:
  #   machineengine:pdc    with the player's own data file (world/playerdata); admins cannot edit offline players
  #   machineengine:files  plugins/MachineEngine/players/, one file per player; works for offline players
  # Addons may add other storages. Switching does not move existing data. Restart to apply.
  storage: machineengine:pdc
  # Seconds between saves of changed player data. Data is also saved when a player leaves and when the server stops.
  save-interval: 60
  # Seconds a joining player waits for their data (storages other than machineengine:pdc).
  # When it takes longer, the player is refused with a message rather than let in without their data.
  load-timeout: 5
  # Default value of player settings (/machinesettings) for players who did not choose, e.g.
  #   "mekanized:radiation_hud": false
  setting-defaults: {}
  # Player settings players may not change: they keep the value of setting-defaults (or the built-in one).
  locked-settings: []

# Resources MachineEngine provides to every addon and definition:
# machineengine:energy, and the fluids machineengine:fluid/water and machineengine:fluid/lava.
# Restart to apply.
resources:
  energy:
    # Unit shown after energy amounts.
    unit: J
    # Decimal digits of energy amounts: with 3, 1500 is shown as 1.500.
    scale: 0
  fluid:
    # Unit shown after fluid amounts.
    unit: mB
    # Decimal digits of fluid amounts.
    scale: 0
    # Amount of fluid in one bucket (and one source block).
    bucket: 1000
