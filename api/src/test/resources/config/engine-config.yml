# MachineEngine configuration.
# Missing settings are added with their defaults when the server starts and on /machineengine reload config.

limits:
  # Most machines a single chunk may hold (players with machineengine.admin are exempt). 0 = no limit.
  max-machines-per-chunk: 256

menus:
  # Machine menus use zMenu (https://modrinth.com/plugin/zmenu). Menu files live in menus/.
  # A machine opens menus.by-type, else the file <namespace>_<value>.yml, else this default.
  default: machine
  # Menu file per machine type, e.g.
  #   example:generator: machine
  by-type: {}

events:
  # Mirror machine events (create, load, unload, remove, process start/complete) as Bukkit events
  # (fr.robie.machineengine.api.paper.event) for plugins that do not use the MachineEngine API.
  # Events nobody listens to cost nothing. Restart to apply.
  bukkit-bridge: true

placeholders:
  # Whether players without machineengine.admin.breakplaceholders may break placeholder machines
  # (machines whose addon is not installed). Breaking one destroys its data.
  allow-breaking: false

players:
  # Where the data addons keep per player (radiation dose, settings, ...) is saved:
  #   machineengine:pdc    with the player's own data file (world/playerdata); admins cannot edit offline players
  #   machineengine:files  plugins/MachineEngine/players/, one file per player; works for offline players
  # Addons may add other storages. Switching does not move existing data. Restart to apply.
  storage: machineengine:pdc
  # Seconds between saves of changed player data. Data is also saved when a player leaves and when the server stops.
  save-interval: 60
  # Seconds a joining player waits for their data (storages other than machineengine:pdc).
  # When it takes longer, the player is refused with a message rather than let in without their data.
  load-timeout: 5
  # Default value of player settings (/machinesettings) for players who did not choose, e.g.
  #   "mekanized:radiation_hud": false
  setting-defaults: {}
  # Player settings players may not change: they keep the value of setting-defaults (or the built-in one).
  locked-settings: []

messages:
  # Language of the console and of players whose client language has no file in lang/ (en_us, fr_fr...).
  # Each player reads lang/<their client's language>.yml, else the same language in another country, else this one.
  # Add a language by copying lang/en_us.yml to lang/<language code>.yml and translating it.
  default-language: en_us
  # Put before every chat message of MachineEngine (MiniMessage), e.g. "<dark_gray>[<gold>Machines</gold>]</dark_gray> ".
  prefix: ''

logging:
  # Log debug lines too: details for bug reports, too many for every day.
  debug: false

# Resources MachineEngine provides to every addon and definition:
# machineengine:energy, and the fluids machineengine:fluid/water and machineengine:fluid/lava.
# Restart to apply.
resources:
  energy:
    # Unit shown after energy amounts.
    unit: J
    # Decimal digits of energy amounts: with 3, 1500 is shown as 1.500.
    scale: 0
  fluid:
    # Unit shown after fluid amounts.
    unit: mB
    # Decimal digits of fluid amounts.
    scale: 0
    # Amount of fluid in one bucket (and one source block).
    bucket: 1000
    # Color of water in menus, "#RRGGBB" (quote it).
    water-color: '#3F76E4'
    # Color of lava in menus, "#RRGGBB" (quote it).
    lava-color: '#E0641A'

# Fluids placed in the world (each fluid's own settings are in its definition and fluids.yml).
world-fluids:
  # Placeable fluids in the world. Off: fluids only live in tanks and pipes.
  enabled: true
  # Every biome's water gets the neutral color for players (swamps and oceans lose their tint).
  # Needed for more than 6 different fluid looks. Players must rejoin.
  uniform-water: true
  # The neutral water color, "#RRGGBB" (quote it). Players must rejoin.
  neutral-color: '#3F76E4'
  # Only without uniform-water: 4-block areas around a fluid that get the neutral color.
  neutral-rings: 6
  # Draw fluids with their own textures (a core shader in the resource pack).
  # Off: fluids are water tinted with a code color.
  shader: true
  # Also draw them for players using Sodium: its shader, patched, in the resource pack.
  # Only Sodium 0.9 and later (Minecraft 26.2+) reads shaders from resource packs.
  sodium: true
  # Where Sodium's shader comes from: "download" (the newest Sodium for this version, from Modrinth, cached)
  # or the path of a Sodium jar (the one your players use).
  sodium-jar: download
  # grid: fluids can have their own textures (a texture grid replaces the water textures, which the shader reads).
  #   Players whose renderer can't take the pack's shader (Sodium before 0.9, OptiFine) see that grid on all water.
  # tint: every fluid is the water texture in its own color, opacity and glow; nobody sees the grid,
  #   and players without the shader see normal water, with fluids in their code color.
  # auto: grid on Minecraft 26.2 and later (Sodium 0.9 takes the shader), tint before.
  # Applies after the pack is rebuilt (/machineengine reload fluids, then /ce reload pack).
  textures: auto
  # Draw a texture for each fluid's own bucket item: the vanilla water bucket in the fluid's color.
  bucket-textures: true
  # With the grid: models of the CraftEngine packs that draw vanilla water (menu fluid bars) use an untouched
  # copy of it, so they don't show the grid.
  water-models: true
  # Where a fluid meets water: soft (fades) or sharp (a line). Applies after the pack is rebuilt.
  edge: soft
  # stop: a fluid and plain water never share a 4-block color area (a small gap between them).
  # allow: they may, and the fluid fades into the water around it (dispersion).
  conflict: stop
  # 4-block areas kept between two different fluids (2 = about 8 blocks).
  # Closer, the client blends both and the blocks between them show plain water.
  fluid-gap: 2
  # 4-block areas around a fluid (where no water is) that get its color: cleaner corners.
  padding: 1
  # With conflict: allow, rings of 4-block areas where a fluid fades into plain water (half, then a quarter).
  dispersion: 2
  # Where vanilla's water textures and shaders come from to build the pack:
  # "download" (the official client jar, from Mojang, cached) or the path of a client jar.
  client-jar: download
  # Most fluid textures per side of the texture grid: 8 holds 63 textures, 16 holds 255 (more memory).
  texture-grid: 8
  # Ticks a changed chunk waits before its colors are sent to players (changes in between go together).
  update-delay: 10
  # Fluid effects and drag on mobs and items too (players always). Off saves the scan of chunks holding fluids.
  entity-effects: true
  # Ticks between two scans of the mobs and items in chunks holding fluids.
  entity-ticks: 4
